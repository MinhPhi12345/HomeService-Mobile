name: home_service_mobile
description: "HomeService - ứng dụng đặt dịch vụ gia đình cho Khách hàng và Tasker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  geolocator: ^14.1.2
  # Bản đồ OpenStreetMap miễn phí, không cần API key (thay cho Google Maps API)
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  # Mở app Google Maps chỉ đường, gọi điện cho khách/Tasker
  url_launcher: ^6.3.1
  # Chụp/chọn ảnh: CCCD, ảnh trước/sau khi làm, ảnh khiếu nại
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Phông Be Vietnam Pro (giấy phép SIL OFL) – dùng chung với Web Customer
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro_400Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro_500Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro_700Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro_800ExtraBold.ttf
          weight: 800
