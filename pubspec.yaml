name: homeservice_mobile
description: "HomeService – App di động dùng chung cho Khách hàng & Tasker (đề tài Công nghệ phần mềm Nâng cao, Nhóm 01)."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1              # gọi API HomeService-Backend
  provider: ^6.1.2           # quản lý state (AuthProvider, BookingProvider...)
  shared_preferences: ^2.2.3 # lưu accessToken cục bộ
  intl: ^0.19.0               # định dạng ngày giờ, tiền tệ

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/
